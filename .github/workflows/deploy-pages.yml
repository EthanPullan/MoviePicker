name: Deploy to GitHub Pages

# Build & publish the static site whenever the site changes on the main
# development branch. You can also run it by hand from the Actions tab.
on:
  push:
    branches:
      - main
      - claude/affectionate-cerf-kd83ex
  workflow_dispatch:

# Permissions the GITHUB_TOKEN needs to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; newer pushes supersede in-flight ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        # Reads the repo's Pages config. Pages must already be enabled with
        # Source = "GitHub Actions" (Settings -> Pages) — the Actions token
        # isn't allowed to turn Pages on for you.
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Publish the repository root, which contains index.html.
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
